name: release
# Tag a version (git tag v0.6.0 && git push origin v0.6.0) to publish .deb and .rpm packages as a GitHub release.
# "Run workflow" by hand builds the same packages as downloadable run artifacts WITHOUT publishing anything (use it to test).
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Package version for a test build (no leading v)'
        default: '0.0.0-test'
permissions:
  contents: write
jobs:
  deb:
    name: 'deb package (built on Ubuntu 24.04; installs on Ubuntu 24.04+, Debian 13+, Kali)'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VERSION=${{ github.event.inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_ENV"
      - name: Build
        run: |
          sudo apt-get update && sudo apt-get install -y cmake build-essential qt6-base-dev qt6-tools-dev qt6-tools-dev-tools qt6-l10n-tools libgl1-mesa-dev dpkg-dev
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DRELEASE_VERSION="$VERSION"
          cmake --build build --parallel
          (cd build && cpack -G DEB)
      - name: Inspect
        run: dpkg -I build/*.deb && dpkg -c build/*.deb | grep -c . && dpkg -c build/*.deb | grep -E "autostart|helper|polkit"
      - uses: actions/upload-artifact@v4
        with: { name: deb, path: build/*.deb }
  rpm:
    name: 'rpm package (built on Fedora)'
    runs-on: ubuntu-latest
    container: fedora:latest
    steps:
      - name: Tools
        run: dnf install -y cmake gcc-c++ make git qt6-qtbase-devel qt6-qttools-devel rpm-build mesa-libGL-devel
      - uses: actions/checkout@v4
      - name: Version
        run: echo "VERSION=${{ github.event.inputs.version || github.ref_name }}" | sed 's/=v/=/' >> "$GITHUB_ENV"
      - name: Build
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr -DRELEASE_VERSION="$VERSION"
          cmake --build build --parallel
          (cd build && cpack -G RPM)
      - name: Inspect
        run: rpm -qpi build/*.rpm && rpm -qpl build/*.rpm | head -40
      - uses: actions/upload-artifact@v4
        with: { name: rpm, path: build/*.rpm }
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [deb, rpm]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Create the release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          ls -la dist
          gh release create "${{ github.ref_name }}" dist/* --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes \
            --notes "Packages: .deb for Ubuntu 24.04+/Debian 13+/Kali, .rpm for Fedora. Other distros: build from source with ./install.sh. See the README's compatibility table for what is verified."
