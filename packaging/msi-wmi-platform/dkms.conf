PACKAGE_NAME="msi-wmi-platform"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="msi-wmi-platform"
DEST_MODULE_LOCATION[0]="/updates/dkms"
AUTOINSTALL="yes"
# needs scoped_guard / devm_mutex_init (Linux 6.5+); older kernels simply do not build it and the app falls back to the guided manual calibration
BUILD_EXCLUSIVE_KERNEL="^(6\.([5-9]|[1-9][0-9])|[7-9]\.|[1-9][0-9]\.)"
